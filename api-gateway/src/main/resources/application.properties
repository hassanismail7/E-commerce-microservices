spring.application.name=api-gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=wallet-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://wallet-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/wallet/**

spring.cloud.gateway.server.webflux.routes[2].id=inventory-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/products/**,/inventory/**

spring.cloud.gateway.server.webflux.routes[3].id=shop-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://shop-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/cart/**,/orders/**